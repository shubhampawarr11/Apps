<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piano</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="piano">
      <!-- White Keys -->
      <div data-key="C" class="key white" data-note="C"></div>
      <div data-key="D" class="key white" data-note="D"></div>
      <div data-key="E" class="key white" data-note="E"></div>
      <div data-key="F" class="key white" data-note="F"></div>
      <div data-key="G" class="key white" data-note="G"></div>
      <div data-key="A" class="key white" data-note="A"></div>
      <div data-key="B" class="key white" data-note="B"></div>

      <!-- Black Keys -->
      <div data-key="C#" class="key black" data-note="C#"></div>
      <div data-key="D#" class="key black" data-note="D#"></div>
      <div data-key="F#" class="key black" data-note="F#"></div>
      <div data-key="G#" class="key black" data-note="G#"></div>
      <div data-key="A#" class="key black" data-note="A#"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
